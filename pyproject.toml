[project]
name = "contextvault"
version = "0.1.0"
description = "Local-first MCP memory layer for AI agents (SQLite + FTS5, optional semantic recall)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]

[project.scripts]
contextvault = "server:main"

[tool.setuptools]
py-modules = ["server", "storage", "ranking", "context_engine", "compression", "embeddings"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
