[project]
name = "context-mem"
version = "0.1.0"
description = "Local-first MCP memory layer for AI agents (SQLite + FTS5, optional semantic recall)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]

[project.scripts]
context-mem = "server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF", "PLC", "FURB"]
ignore = [
  "PLC0415",  # lazy imports are intentional (server import order, heavy deps)
  "SIM108",   # nested ternaries are harder to read than the if/else they replace
]

[tool.ruff.lint.per-file-ignores]
"demo_portfolio.py" = ["E501"]  # ASCII-art banner lines

[tool.setuptools]
py-modules = ["server", "storage", "ranking", "context_engine", "compression", "embeddings"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
